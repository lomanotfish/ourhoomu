        "x-idempotency": "Linearize per refresh family under DB lock. Store old-token digest + Idempotency-Key + body hash and an encrypted result for at most 5 minutes. Exact retry within 5 minutes returns the same rotated pair only while family remains active; concurrent same-key calls converge. Reuse of old token with any other key/body or after replay window revokes family and returns opaque 401. Logout/revocation always wins over replay and returns 401. Never store or log raw credentials unencrypted.",
        "x-refresh-rotation": {
          "familyLock": "serialize by refresh family",
          "exactReplayWindowSeconds": 300,
          "exactReplayKey": [
            "oldCredentialDigest",
            "Idempotency-Key",
            "bodyHash"
          ],
          "differentReplay": "revoke family; opaque 401",
          "afterLogout": "opaque 401, including an exact old-key retry",
          "secrets": "hash stored credentials and encrypt bounded replay result; no raw logs"
        },
