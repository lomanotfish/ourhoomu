          "anchorDate",
          "startDate",
          "interval",
          "weekdays",
          "assigneeMembershipIds"
        ],
        "description": "Recurring schedule rule. Manual one-off chores use ChoreCreate, not a schedule. Dates are house-local; weekday numbers use JavaScript/ISO-independent Sunday=0 through Saturday=6. Rotation follows eligible dates from anchorDate, never completion order.",
        "allOf": [
          {
            "if": {
              "properties": {
                "mode": {
                  "const": "repeat"
